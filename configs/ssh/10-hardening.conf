# Login only by key
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

#Root by SSH never login
PermitRootLogin no

#Allowed users
AllowUsers YourUserName

#Limitation of guessing
MaxAuthTries 3
LoginGraceTime 30

#Turning off what's not needed
X11Forwarding no

#Close hing sessions
ClientAliveInterval 300
ClinetAliveCountMax 2
